<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app"></div>

    <script>
      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        date: { type: 'date', formatting: 'EEE d MMM h:mm a' },
        cpu: { type: 'cpu' },
        memory: { type: 'memory' },
        battery: { type: 'battery' }
      });

      providers.onOutput((output) => {
        const glazewm = output.glazewm;
        
        // Render workspaces
        let workspacesHtml = '';
        if (glazewm) {
           glazewm.currentWorkspaces.forEach(workspace => {
              const classes = ['workspace'];
              if (workspace.hasFocus) classes.push('focused');
              if (workspace.isVisible) classes.push('visible');
              
              // Note: Since we can't easily add onclick handlers in this string template that call back to the provider 
              // (unless using runCommand), we'll just display them for now. 
              // But zebar often allows `onclick="glazewm.runCommand('focus --workspace ${workspace.name}')"` if accessible.
              // However, safely we just render state.
              workspacesHtml += `<div class="${classes.join(' ')}">${workspace.name}</div>`;
           });
        }

        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="left">
            <div class="workspaces" style="display:flex; gap:4px;">${workspacesHtml}</div>
          </div>
          <div class="center">
             <span class="clock">${output.date ? output.date.formatted : ''}</span>
          </div>
          <div class="right">
             ${output.cpu ? `<div class="stat">CPU: ${Math.round(output.cpu.usage)}%</div>` : ''}
             ${output.memory ? `<div class="stat">RAM: ${Math.round(output.memory.usage)}%</div>` : ''}
             ${output.battery ? `<div class="stat">BAT: ${Math.round(output.battery.chargePercent)}%</div>` : ''}
          </div>
        `;
      });
    </script>
  </body>
</html>
